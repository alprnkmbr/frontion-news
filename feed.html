<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>News Feed — Frontion News</title>
    <meta name="description" content="Live news feed — geopolitical headlines from trusted outlets, continuously updated.">
    <meta property="og:title" content="News Feed — Frontion News">
    <meta property="og:description" content="Live news feed — geopolitical headlines from trusted outlets, continuously updated.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://frontion.news/feed">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Frontion">
    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
    <script>
(function(){
  var dark=false;
  try{dark=localStorage.getItem('darkMode')==='1'}catch(e){try{dark=document.cookie.indexOf('darkMode=1')!==-1}catch(e2){}}
  if(!dark&&typeof matchMedia==='function'){try{dark=matchMedia('(prefers-color-scheme:dark)').matches}catch(e){}}
  if(dark)document.documentElement.classList.add('dark-mode');
})()
</script>
    <style>
:root {
    --color-bg: #ffffff;
    --color-text: #1a1a1a;
    --color-text-body: #333333;
    --color-text-secondary: #666666;
    --color-text-tertiary: #999999;
    --color-accent: #c41e3a;
    --color-border: #ddd;
    --color-border-light: #eee;
    --color-section-rule: #1a1a1a;
    --color-card-hover: #fafafa;
    --color-chip-bg: #f2f2f2;
    --font-display: 'Playfair Display', 'Noto Serif', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --feed-width: 600px;
}
html.dark-mode {
    --color-bg: #0d0d0d;
    --color-text: #e8e8e8;
    --color-text-body: #cccccc;
    --color-text-secondary: #999999;
    --color-text-tertiary: #666666;
    --color-accent: #e8445a;
    --color-border: #333333;
    --color-border-light: #222222;
    --color-section-rule: #e8e8e8;
    --color-card-hover: #141414;
    --color-chip-bg: #1a1a1a;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
    font-family: var(--font-body);
    color: var(--color-text);
    background: var(--color-bg);
    line-height: 1.6;
    max-width: 100vw;
    overflow-x: hidden;
    padding-bottom: 4rem;
}

/* ---------- HEADER (Frontion kimliği) ---------- */
.site-header { text-align: center; border-bottom: 3px solid var(--color-section-rule); padding: 1.3rem 1rem 0.9rem; }
.site-header a.logo { font-family: var(--font-display); font-size: 2.3rem; font-weight: 700; color: var(--color-text); text-decoration: none; letter-spacing: -0.03em; display: inline-block; line-height: 1.1; }
.tagline { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--color-accent); margin-top: 0.4rem; font-weight: 600; }

/* ---------- NAV ---------- */
.top-nav { display: flex; justify-content: center; gap: 1.05rem; padding: 0.65rem 1rem; border-bottom: 1px solid var(--color-border-light); flex-wrap: wrap; }
.top-nav a { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--color-text-secondary); text-decoration: none; }
.top-nav a:hover, .top-nav a.active { color: var(--color-accent); }

/* ---------- STATUS STRIP ---------- */
.status-strip {
    position: sticky; top: 0; z-index: 50;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    padding: 0.55rem 1rem;
    max-width: var(--feed-width); margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
}
html.dark-mode .status-strip { background: rgba(13,13,13,0.94); }
.status-label { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); display: inline-block; margin-right: 0.4rem; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
.updated { font-size: 0.66rem; color: var(--color-text-tertiary); }

/* ---------- FEED ---------- */
.feed { max-width: var(--feed-width); margin: 0 auto; }
.card { position: relative;
    padding: 1.15rem 1rem 1.3rem;
    border-bottom: 1px solid var(--color-border-light);
    transition: background 0.15s, opacity 0.25s, transform 0.25s;
}
.card.removing { opacity: 0; transform: translateX(24px); }

/* Sil butonu (x) */
.del-btn {
    position: absolute; top: 0.6rem; right: 0.55rem;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; line-height: 1; font-weight: 400;
    color: var(--color-text-tertiary);
    background: var(--color-bg); border: 1px solid var(--color-border-light);
    cursor: pointer; opacity: 0; transition: all 0.15s; z-index: 5;
}
.card:hover .del-btn { opacity: 1; }
.del-btn:hover { color: #fff; background: var(--color-accent); border-color: var(--color-accent); }
.del-btn:disabled { opacity: 0.4; cursor: default; }
.card:hover { background: var(--color-card-hover); }
.card.is-new { animation: fadein 0.6s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.card-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
.avatar {
    flex: 0 0 20px; width: 20px; height: 20px; border-radius: 4px;
    object-fit: contain; background: transparent;
}
.src-name { font-weight: 600; font-size: 0.78rem; color: var(--color-text); }
.dot-sep { color: var(--color-text-tertiary); font-size: 0.7rem; }
.time { font-size: 0.74rem; color: var(--color-text-tertiary); }

.card-title { font-family: var(--font-display); font-weight: 700; font-size: 1.12rem; line-height: 1.32; margin-bottom: 0.35rem; color: var(--color-text); }
.card-title a { color: inherit; text-decoration: none; }
.card-title a:hover { color: var(--color-accent); }
.card-summary { font-size: 0.88rem; color: var(--color-text-body); line-height: 1.55; margin-bottom: 0.7rem; }

/* Görsel: altta, büyük, tam genişlik */
.card-image { width: 100%; border-radius: 10px; overflow: hidden; background: var(--color-border-light); margin-bottom: 0.7rem; border: 1px solid var(--color-border-light); }
.card-image img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; }

/* Alt satır: kaynak linki + video butonu */
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.card-link { font-size: 0.74rem; color: var(--color-text-secondary); text-decoration: none; }
.card-link:hover { color: var(--color-accent); text-decoration: underline; }
.vid-btn {
    display: inline-flex; align-items: center; gap: 0.32rem;
    font-family: var(--font-body); font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase;
    padding: 0.32rem 0.7rem; border-radius: 999px;
    border: 1px solid var(--color-border); background: transparent;
    color: var(--color-text-secondary); text-decoration: none; white-space: nowrap;
    transition: all 0.15s;
}
.vid-btn:hover { border-color: var(--color-accent); color: var(--color-accent); }

.load-more { display: block; margin: 1.8rem auto; padding: 0.7rem 2rem; font-family: var(--font-body); font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-text); background: transparent; border: 1.5px solid var(--color-border); border-radius: 999px; cursor: pointer; }
.load-more:hover { border-color: var(--color-text); }
.empty { text-align: center; color: var(--color-text-secondary); padding: 3rem 1rem; font-size: 0.9rem; }

/* ---------- FOOTER ---------- */
.site-footer { text-align: center; padding: 2rem 1rem 1rem; border-top: 1px solid var(--color-border-light); font-size: 0.76rem; color: var(--color-text-secondary); margin-top: 2rem; }
.site-footer a { color: var(--color-text-secondary); }
.dark-toggle { position: fixed; top: 0.9rem; right: 0.9rem; z-index: 60; width: 32px; height: 32px; border-radius: 50%; background: var(--color-bg); border: 1px solid var(--color-border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.9rem; }

@media (max-width: 520px) {
    .card-title { font-size: 1.04rem; }
    .site-header a.logo { font-size: 1.95rem; }
    .card { padding: 1rem 0.85rem 1.15rem; }
}
</style>
</head>
<body>

<div class="dark-toggle" id="darkToggle" onclick="toggleDark()" title="Toggle dark mode"><span id="darkIcon">&#9790;</span></div>

<header class="site-header">
    <a href="/" class="logo">Frontion News</a>
    <div class="tagline">News Feed</div>
</header>

<nav class="top-nav">
    <a href="/">Home</a>
    <a href="/global">Global</a>
    <a href="/defence">Defence</a>
    <a href="/energy">Energy</a>
    <a href="/tech">Tech</a>
    <a href="/weekly">Weekly</a>
    <a href="/feed" class="active">Feed</a>
</nav>

<div class="status-strip">
    <span class="status-label"><span class="live-dot"></span>Live</span>
    <span class="updated" id="updatedText">Loading…</span>
</div>

<main class="feed" id="feed">
    <div class="empty">Loading feed…</div>
</main>

<button class="load-more" id="loadMore" style="display:none" onclick="showMore()">Load more</button>

<footer class="site-footer">
    <p>&copy; 2026 Frontion News. All rights reserved.</p>
    <p style="margin-top:0.3rem"><a href="/about">About</a> &nbsp;·&nbsp; <a href="mailto:contact@frontion.news">Contact</a></p>
</footer>

<script>
var ALL_ITEMS = [];
var SHOWN = 30;
var STEP = 30;
var SEEN_IDS = {};
var FIRST_LOAD = true;

// Video adayı göndermek için Telegram bot kullanıcı adı (A seçeneği: t.me deep link)
var TG_BOT = 'FrontionNewsBot';  // video onay akışının botu (frontion-bot/bot.py ile aynı bot)

// --- Silme (×) / öğrenme altyapısı ---
// × basınca hidden.json'a yazılır (kalıcı). fetch_feed.py silinenleri feed'e
// sokmaz ve onları LLM seçici için negative örnek olarak kullanır.
// Token parçalı/base64 tutulur (GitHub secret-scanning düz metni engelliyor).
var GH = {
    owner: 'alprnkmbr',
    repo: 'frontion-news',
    branch: 'main',
    path: 'hidden.json'
};
var _tk = ['Z2l0aHViX3BhdF8xMUJOVExESEkwVGR',
           'waHJhWU42elB1X2phdnVZVlRsM3BOS0',
           '56RTU3Tnl2SGNTRXBtUlM2YWNxMzkyT',
           'jJBQnF3djkyVVNXSFBYNHhqU09jemVN'];
function ghToken() { try { return atob(_tk.join('')); } catch (e) { return ''; } }

function initials(name) {
    var parts = String(name).trim().split(/\s+/);
    if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
}
// (initials is no longer used for avatars; kept for reference)

function timeAgo(ts) {
    var d = (Date.now() / 1000) - ts;
    if (d < 60) return 'now';
    if (d < 3600) return Math.floor(d / 60) + 'm';
    if (d < 86400) return Math.floor(d / 3600) + 'h';
    if (d < 604800) return Math.floor(d / 86400) + 'd';
    return new Date(ts * 1000).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function logoSlug(name) {
    return String(name).toLowerCase()
        .replace(/\./g, '')
        .replace(/\s+/g, '-')
        .replace(/[áàâ]/g, 'a').replace(/[éèê]/g, 'e').replace(/[íìî]/g, 'i')
        .replace(/[óòô]/g, 'o').replace(/[úùû]/g, 'u').replace(/ñ/g, 'n');
}

function renderItem(it) {
    var el = document.createElement('article');
    el.className = 'card';
    if (!FIRST_LOAD && !SEEN_IDS[it.id]) el.className += ' is-new';
    SEEN_IDS[it.id] = true;

    var imgHtml = it.thumb
        ? '<div class="card-image"><img loading="lazy" src="' + it.thumb + '" alt=""></div>'
        : '';

    // A seçeneği: t.me deep link ile video adayı gönder
    var tgHref = '';
    if (TG_BOT) {
        var txt = 'WEB_PUBLISH\n' +
                  'Başlık: ' + it.title + '\n' +
                  'Kaynak: ' + it.source + '\n' +
                  'Link: ' + it.link + '\n' +
                  'Özet: ' + (it.summary || it.title);
        tgHref = 'https://t.me/' + TG_BOT + '?text=' + encodeURIComponent(txt);
    }
    var vidHtml = tgHref
        ? '<a class="vid-btn" href="' + tgHref + '" target="_blank" rel="noopener" title="Send to Telegram for video approval">\u25B6 Video</a>'
        : '<a class="vid-btn" href="' + it.link + '" target="_blank" rel="noopener">\u25B6 Video</a>';

    el.innerHTML =
        '<button class="del-btn" type="button" title="Delete this story" aria-label="Delete">\u00d7</button>' +
        '<div class="card-head">' +
            '<img class="avatar" src="feed/logos/' + logoSlug(it.source) + '.png" alt="" onerror="this.style.display=\'none\'">' +
            '<span class="src-name">' + escapeHtml(it.source) + '</span>' +
            '<span class="dot-sep">·</span>' +
            '<span class="time">' + timeAgo(it.ts) + '</span>' +
        '</div>' +
        '<h2 class="card-title"><a href="' + it.link + '" target="_blank" rel="noopener">' + escapeHtml(it.title) + '</a></h2>' +
        (it.summary ? '<p class="card-summary">' + escapeHtml(it.summary) + '</p>' : '') +
        imgHtml +
        '<div class="card-foot">' +
            '<a class="card-link" href="' + it.link + '" target="_blank" rel="noopener">' + hostOf(it.link) + ' \u2197</a>' +
            vidHtml +
        '</div>';

    var delBtn = el.querySelector('.del-btn');
    if (delBtn) {
        delBtn.addEventListener('click', function (ev) {
            ev.preventDefault(); ev.stopPropagation();
            deleteItem(it, el);
        });
    }
    return el;
}

function render() {
    var feed = document.getElementById('feed');
    var slice = ALL_ITEMS.slice(0, SHOWN);
    feed.innerHTML = '';
    if (!slice.length) {
        feed.innerHTML = '<div class="empty">No stories yet.</div>';
        document.getElementById('loadMore').style.display = 'none';
        return;
    }
    var frag = document.createDocumentFragment();
    for (var i = 0; i < slice.length; i++) frag.appendChild(renderItem(slice[i]));
    feed.appendChild(frag);
    document.getElementById('loadMore').style.display = ALL_ITEMS.length > SHOWN ? 'block' : 'none';
}

function showMore() { SHOWN += STEP; render(); }

// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// SILME (x) - GitHub Contents API ile hidden.json'a yazar (telefondan da calisir)
// ---------------------------------------------------------------------------

function b64EncodeUnicode(str) {
    return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str) {
    return decodeURIComponent(escape(atob(str.replace(/\s/g, ''))));
}
function ghApiUrl() {
    return 'https://api.github.com/repos/' + GH.owner + '/' + GH.repo +
           '/contents/' + GH.path + '?ref=' + GH.branch;
}

async function deleteItem(it, cardEl) {
    if (!confirm('Bu haberi kalici olarak sil?\n\n' + it.title)) return;
    var btn = cardEl.querySelector('.del-btn');
    if (btn) { btn.disabled = true; btn.textContent = '...'; }
    try {
        // mevcut hidden.json'u oku
        var cur = { data: { updated: '', count: 0, items: [] }, sha: null };
        var r = await fetch(ghApiUrl(), {
            headers: { 'Authorization': 'Bearer ' + ghToken(), 'Accept': 'application/vnd.github+json' },
            cache: 'no-store'
        });
        if (r.ok) {
            var j = await r.json();
            cur.data = JSON.parse(b64DecodeUnicode(j.content));
            cur.sha = j.sha;
        } else if (r.status !== 404) {
            throw new Error('okuma ' + r.status);
        }
        var store = cur.data || {};
        if (!Array.isArray(store.items)) store.items = [];
        if (!store.items.some(function (h) { return h.id === it.id; })) {
            store.items.unshift({
                id: it.id,
                title: it.title,
                summary: it.summary || '',
                source: it.source || '',
                link: it.link || '',
                deletedAt: new Date().toISOString()
            });
        }
        store.count = store.items.length;
        store.updated = new Date().toISOString();

        var body = {
            message: 'hide: ' + it.id,
            content: b64EncodeUnicode(JSON.stringify(store, null, 2)),
            branch: GH.branch
        };
        if (cur.sha) body.sha = cur.sha;

        var resp = await fetch(ghApiUrl().split('?')[0], {
            method: 'PUT',
            headers: { 'Authorization': 'Bearer ' + ghToken(), 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        if (!resp.ok) {
            var msg = '';
            try { msg = (await resp.json()).message || ''; } catch (e) {}
            throw new Error(resp.status + ' ' + msg);
        }
        HIDDEN_IDS[it.id] = 1;
        cardEl.classList.add('removing');        setTimeout(function () {
            ALL_ITEMS = ALL_ITEMS.filter(function (x) { return x.id !== it.id; });
            cardEl.remove();
            updateStamp();
        }, 250);
    } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = '\u00d7'; }
        alert('Silinemedi: ' + e.message);
    }
}

function updateStamp() {
    if (!ALL_ITEMS.length) return;
    document.getElementById('updatedText').textContent = 'Updated ' + timeAgo(ALL_ITEMS[0].ts) + ' ago';
}

var HIDDEN_IDS = {};

async function loadHidden() {
    // Silinen haberleri feed'den gizlemek icin (sayfa yenilense de gitmis kalsin)
    try {
        var r = await fetch('hidden.json?v=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
            var d = await r.json();
            var m = {};
            (d.items || []).forEach(function (h) { if (h.id) m[h.id] = 1; });
            HIDDEN_IDS = m;
        }
    } catch (e) {}
}

async function loadFeed(silent) {
    try {
        await loadHidden();
        var resp = await fetch('feed.json?v=' + Date.now());
        if (!resp.ok) throw new Error('feed.json ' + resp.status);
        var data = await resp.json();
        ALL_ITEMS = (data.items || [])
            .filter(function (x) { return !HIDDEN_IDS[x.id]; })
            .slice().sort(function (a, b) { return b.ts - a.ts; });
        updateStamp();
        render();
        FIRST_LOAD = false;
    } catch (e) {
        if (!silent) document.getElementById('feed').innerHTML = '<div class="empty">Could not load the feed. Retrying…</div>';
    }
}

function toggleDark() {
    var isDark = document.documentElement.classList.toggle('dark-mode');
    document.getElementById('darkIcon').innerHTML = isDark ? '&#9788;' : '&#9790;';
    try { localStorage.setItem('darkMode', isDark ? '1' : '0'); } catch (e) {}
}
document.getElementById('darkIcon').innerHTML = document.documentElement.classList.contains('dark-mode') ? '&#9788;' : '&#9790;';

loadFeed(false);
setInterval(function () { loadFeed(true); }, 60000);
</script>
</body>
</html>
